[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-os"
version = "0.3.0"
description = "A privacy-first personal operating company powered by specialized agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
life-os = "life_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/life_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
